spring.application.name=SubegIA
server.port=${PORT:8080}
assessment.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:4200}
assessment.weather.base-url=${OPEN_METEO_BASE_URL:https://historical-forecast-api.open-meteo.com}


# Weather Grid Properties
assessment.grid.model=meteofrance_arome_france_hd
assessment.grid.longitude-origin=-12.0
assessment.grid.latitude-origin=37.5
assessment.grid.longitude-step=0.01
assessment.grid.latitude-step=0.01
assessment.grid.columns=2801
assessment.grid.rows=1791

# Rest Client
spring.http.clients.connect-timeout=5s
spring.http.clients.read-timeout=30s